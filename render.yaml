services:
  # Spring Boot Backend Web Service
  - type: web
    name: slumber-sync-backend
    runtime: docker
    dockerrootDir: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: slumber-sync-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

databases:
  # Managed PostgreSQL Free Tier Database
  - name: slumber-sync-db
    databaseName: slumbersync
    user: slumbersync_user
    plan: free
    region: oregon
